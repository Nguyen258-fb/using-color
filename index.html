<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sử dụng màu sắc trong trang web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #00BFF2; /* Màu nền chuyển thành màu bậc 4 */
            color: black; /* Giữ nguyên màu chữ đen */
        }
        header {
            background-color: #00ADEE; /* Màu chủ đạo bậc 1 */
            color: white;
            padding: 20px;
            text-align: center;
        }
        .onsale {
            background-color: #00B2EF; /* Màu nền phần ON SALE/PREVIEW tông bậc 1 hoặc 2 */
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
        .content {
            background-color: #8DD7F7; /* Màu nền phần nội dung chuyển thành màu bậc 7 */
            color: black; /* Giữ nguyên chữ màu đen vì nền nhạt */
            padding: 20px;
            margin: 20px;
            border-radius: 5px;
        }
        footer {
            background-color: #C6E9FA; /* Màu nền footer chuyển thành màu bậc 9 tạo độ sáng */
            color: black;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Trang Web Phối Màu Đơn Tông</h1>
    </header>

    <div class="onsale">
        ON SALE / PREVIEW
    </div>

    <div class="content">
        <h2>Nội dung bài viết</h2>
        <p>Thực hành phối màu đơn tông theo các bước yêu cầu của bài học giúp giao diện trực quan và chuyên nghiệp hơn.</p>
    </div>

    <footer>
        <p>&copy; 2026 - Bản quyền thuộc về bạn.</p>
    </footer>

</body>
</html>
